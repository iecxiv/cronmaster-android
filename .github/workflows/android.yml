name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-main
  cancel-in-progress: false

jobs:
  wrapper:
    name: Ensure official Gradle wrapper
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate and commit wrapper only if incomplete
        id: prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          for file in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            [[ -s "$file" ]] || missing=1
          done
          if [[ "$missing" == 1 ]]; then
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT
            curl --fail --location --show-error --retry 3 --proto '=https' --proto-redir '=https' \
              https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256 -o "$tmp/checksum"
            checksum="$(tr -d '\r\n ' < "$tmp/checksum")"
            [[ "$checksum" =~ ^[[:xdigit:]]{64}$ ]] || { echo "Invalid distribution checksum" >&2; exit 1; }
            printf "rootProject.name = 'wrapper-bootstrap'\n" > "$tmp/settings.gradle"
            touch "$tmp/build.gradle"
            gradle --no-daemon -p "$tmp" wrapper --gradle-version 8.9 --distribution-type bin \
              --gradle-distribution-sha256-sum "$checksum"
            mkdir -p gradle/wrapper
            install -m 755 "$tmp/gradlew" gradlew
            install -m 644 "$tmp/gradlew.bat" gradlew.bat
            install -m 644 "$tmp/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
            install -m 644 "$tmp/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/gradle-wrapper.properties
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
            git update-index --chmod=+x gradlew
            if ! git diff --cached --quiet; then
              git commit -m "Add official Gradle 8.9 wrapper and distribution checksum"
              git push origin HEAD:main
            fi
          fi
          test -s gradle/wrapper/gradle-wrapper.jar
          grep -Fq 'gradle-8.9-bin.zip' gradle/wrapper/gradle-wrapper.properties
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Test and build APK with wrapper
    needs: wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.wrapper.outputs.revision }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cronmaster-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
