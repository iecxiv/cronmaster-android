name: Build Android dev

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-dev.yml"

permissions:
  contents: read

concurrency:
  group: android-dev
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests and build dev debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cronmaster-dev-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
